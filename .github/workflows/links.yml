name: Links

on:
  schedule:
    # Mondays 03:30 UTC (09:00 IST).
    - cron: "30 3 * * 1"
  workflow_dispatch:

concurrency:
  group: links
  cancel-in-progress: true

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The checker has no dependencies (built-in fetch), so no npm ci.
      - run: node scripts/check-links.mjs
